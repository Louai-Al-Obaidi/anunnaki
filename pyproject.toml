[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anunnaki"
dynamic = ["version"]
description = "A local Windows desktop file-to-Markdown converter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Louai Al Obaidi" }]
dependencies = [
  "PySide6>=6.7,<7",
  "markitdown[all]==0.1.7",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.7", "pyinstaller>=6.10", "pytest>=8.2", "ruff>=0.6"]

[project.scripts]
anunnaki = "doc2markdown_desktop.app:main"

[tool.setuptools]
package-dir = { "" = "packages", "doc2markdown_desktop" = "src/doc2markdown_desktop" }

[tool.setuptools.dynamic]
version = { attr = "doc2markdown_desktop.version.__version__" }

[tool.setuptools.packages.find]
where = ["packages", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "packages", "tests"]
exclude = ["markitdown-main"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
