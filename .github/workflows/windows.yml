name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src/doc2markdown_desktop tests
      - run: pytest
      - run: pyinstaller --noconfirm --clean --distpath dist --workpath build src/doc2markdown_desktop/packaging/Anunnaki.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Anunnaki-Windows-x64-exe
          path: dist/Anunnaki.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Anunnaki-Windows-x64-portable
          path: dist/Anunnaki/
