name: Release Anunnaki for Windows

on:
  push:
    tags: ["anunnaki-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Confirm tag matches the application version
        shell: pwsh
        run: |
          $expected = "anunnaki-v$(python -c "from doc2markdown_desktop.version import __version__; print(__version__)")"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$expected'."
          }
      - name: Lint and test
        run: |
          ruff check .
          ruff format --check src/doc2markdown_desktop tests
          pytest
      - name: Build portable application
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build src/doc2markdown_desktop/packaging/Anunnaki.spec
      - name: Verify build outputs
        shell: pwsh
        run: |
          $required = @(
            'dist/Anunnaki.exe',
            'dist/Anunnaki',
            'dist/Anunnaki/_internal',
            'dist/Anunnaki/_internal/magika/models/standard_v3_3/model.onnx'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected build output is missing: $path"
            }
          }
          if ((Get-Item -LiteralPath 'dist/Anunnaki.exe').Length -le 0) {
            throw 'Anunnaki.exe is empty.'
          }
      - name: Prepare release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Anunnaki.exe release/Anunnaki-Windows-x64.exe
          Compress-Archive -Path dist/Anunnaki -DestinationPath release/Anunnaki-Windows-x64-portable.zip
          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash, $_.Path.Substring((Resolve-Path release).Path.Length + 1) } |
            Set-Content -Encoding ascii release/SHA256SUMS.txt
          if ((Get-Item -LiteralPath 'release/Anunnaki-Windows-x64-portable.zip').Length -le 0) {
            throw 'Portable ZIP is empty.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'release/Anunnaki-Windows-x64-portable.zip'))
          try {
            if (-not ($archive.Entries.FullName -contains 'Anunnaki/Anunnaki.exe')) {
              throw 'Portable ZIP does not contain Anunnaki.exe.'
            }
          } finally {
            $archive.Dispose()
          }
          if ((Get-Content -LiteralPath release/SHA256SUMS.txt).Count -ne 2) {
            throw 'SHA256SUMS.txt must contain exactly the two release assets.'
          }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Anunnaki-Windows-x64.exe
            release/Anunnaki-Windows-x64-portable.zip
            release/SHA256SUMS.txt
